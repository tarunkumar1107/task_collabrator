spring:
  application:
    name: taskmaster
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskmaster;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:TaskMasterDevSecretKeyThatIsLongEnoughForHS256AlgorithmSecurity}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  llm:
    # Placeholder key — the AI description endpoint runs in local stub mode until this is
    # replaced with a real OpenAI key (see README > AI task description generation).
    api-key: ${APP_LLM_API_KEY:dummy-llm-api-key}
    api-url: ${APP_LLM_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${APP_LLM_MODEL:gpt-4o-mini}
    timeout-ms: ${APP_LLM_TIMEOUT_MS:15000}

logging:
  level:
    com.taskmaster: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    default-models-expand-depth: 2
    default-model-expand-depth: 2
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
