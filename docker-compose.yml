services:
  taskmaster:
    build: .
    image: taskmaster:1.0.0
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      APP_JWT_SECRET: "TaskMasterDockerSecretKeyThatIsLongEnoughForHS256"
      APP_JWT_EXPIRATION_MS: "86400000"
      APP_UPLOAD_DIR: "/app/uploads"
      # AI task-description endpoint runs in local stub mode until this is a real OpenAI key.
      APP_LLM_API_KEY: "dummy-llm-api-key"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    volumes:
      - taskmaster_uploads:/app/uploads
    restart: unless-stopped

volumes:
  taskmaster_uploads:
